# ─────────────────────────────────────────────────────────────────────────────
# CRM Research Platform — Docker Compose
# Project: Comparative Study of Rule-Based vs Lightweight ML Lead Scoring
#
# Services:
#   scoring-service   FastAPI scoring microservice (port 8000)
#   n8n               Workflow automation (port 5678)
#   n8n-postgres      Dedicated PostgreSQL for n8n internal storage ONLY
#                     (CRM data lives in Neon — no local CRM postgres needed)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Scoring Microservice ───────────────────────────────────────────
  scoring:
    build:
      context: ./scoring-service
      dockerfile: Dockerfile
    container_name: crm-scoring
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./scoring-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crm-network

  # ── n8n Workflow Automation ────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: crm-n8n
    restart: on-failure:5
    ports:
      - "5678:5678"
    entrypoint: >
      sh -c "sleep 5 && tini -- /docker-entrypoint.sh"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n_secret_change_me}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      CRM_API_URL: http://host.docker.internal:3000
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
    depends_on:
      n8n-postgres:
        condition: service_healthy
    networks:
      - crm-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── n8n Internal PostgreSQL (NOT the CRM database) ────────────────────────
  n8n-postgres:
    image: postgres:16-alpine
    container_name: crm-n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n_secret_change_me}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network
    expose:
      - "5432"

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  n8n_data:
    driver: local
  n8n_postgres_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  crm-network:
    driver: bridge